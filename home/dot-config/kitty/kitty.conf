# All options: https://sw.kovidgoyal.net/kitty/conf/

font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
disable_ligatures always

cursor_shape          block
cursor_blink_interval 0

# Leftover pixels (window size not a multiple of the cell size) go to the
# bottom and right edge, not around the text.
placement_strategy top-left

# Close without asking, like Alacritty.
confirm_os_window_close 0

# Plain terminal for zellij: no kitty tabs or splits, all Ctrl+Shift keys go to
# zellij. Comment out to get kitty's own tabs and shortcuts back.
# Must come before the maps below: it removes all shortcuts defined before it.
include zellij.conf

# Same as in alacritty.toml
map shift+enter send_text all \x1b\r

include current-theme.conf
